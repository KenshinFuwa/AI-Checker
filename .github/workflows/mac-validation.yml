name: AI Checker source validation
on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-linux:
    name: Swift core and source checks (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          python3 --version
      - name: Portable Swift core and source checks (no macOS-only RPC)
        run: bash scripts/check-source-core.sh
  mac-native:
    name: Native AppKit build and tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          python3 --version
      - name: Full native checks
        run: bash scripts/check.sh
      - name: Show signing-free release build information
        run: |
          swift build --jobs 2 -c release
          echo 'This is NOT a Developer ID-signed/notarized binary release.'
  universal-macos:
    name: Universal 2 + DMG layout audit (macOS, no signing)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify non-secret source manifest
        run: python3 scripts/verify-source-manifest.py
      - name: Build Universal 2, stage app, mount and audit temporary DMG
        run: AI_CHECKER_CI_BOOTSTRAP=1 bash scripts/check-universal-build.sh
      - name: Note distribution status
        run: echo 'This job produces no distributable app; Developer ID and notarization remain mandatory.'
